
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack Undo System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Stack Undo System</h1>
    <p>Enter text and use the stack to undo your changes.</p>

    <input type="text" id="textInput" placeholder="Enter text">
    <button id="addButton">Add Text</button>
    <button id="undoButton">Undo</button>

    <h3>Current Text</h3>
    <p id="currentText">Empty</p>

    <h3>Stack History</h3>
    <ul id="history"></ul>
    <p id="message"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
